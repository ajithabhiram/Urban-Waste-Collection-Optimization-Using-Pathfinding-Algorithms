<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Collection Route Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-green-50 to-teal-100 min-h-screen flex flex-col">
    <header class="bg-gradient-to-r from-blue-600 to-teal-500 text-white py-6 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold flex items-center justify-center gap-2">
                <span>🚛</span> Garbage Collection Route Planner
            </h1>
            <p class="mt-2 text-lg sm:text-xl font-medium opacity-90">
                Optimize routes for cleaner, greener cities
            </p>
        </div>
    </header>

    <main class="flex-grow">
        <div class="max-w-2xl mx-auto mt-10 mb-16 px-4 sm:px-6">
            <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-6 sm:p-8 border border-gray-100">
                <h2 class="text-2xl sm:text-3xl font-semibold text-gray-800 text-center mb-8">
                    Plan Your Route
                </h2>
                <form action="/" method="POST" class="space-y-6">
                    <div>
                        <label for="start_location" class="block text-lg font-medium text-gray-700 mb-2">
                            🌍 Select Starting Location
                        </label>
                        <select
                            name="start_location"
                            id="start_location"
                            required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-lg text-gray-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                        >
                            {% for location in locations %}
                                <option value="{{ loop.index0 }}">{{ location }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button
                        type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-teal-500 text-white py-3 rounded-lg font-semibold text-lg hover:from-blue-700 hover:to-teal-600 focus:ring-4 focus:ring-blue-300 transition duration-200 shadow-md"
                    >
                        📍 Calculate Optimal Routes
                    </button>
                </form>
                <div class="mt-8 text-center text-gray-600 space-y-2">
                    <p class="text-base">💡 Select a starting point to optimize garbage collection routes.</p>
                    <p class="text-base">🔍 Powered by advanced routing algorithms.</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gradient-to-r from-gray-800 to-gray-900 text-white py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-base">Made with ❤️ to revolutionize waste management.</p>
            <p class="mt-2 text-sm">
                <a href="#" class="text-teal-300 hover:text-teal-200 transition duration-200">Contact Us</a>
            </p>
        </div>
    </footer>
</body>
</html>
